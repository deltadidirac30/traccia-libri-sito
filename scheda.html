<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script>
    // Tema: scelta salvata, altrimenti quello del sistema (prima del disegno, niente lampi)
    (function () {
      try {
        var t = localStorage.getItem('tl-theme');
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion');
        // pagina già vista in questa sessione: niente animazioni d'ingresso
        if (sessionStorage.getItem('tl:seen:' + location.pathname.split('/').pop())) document.documentElement.classList.add('tl-seen');
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <meta name="color-scheme" content="light dark">
  <title>Scheda Libro — Traccia Libri Lettura</title>
  <link rel="preload" href="fonts/instrument-sans-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/newsreader-var.woff2" as="font" type="font/woff2" crossorigin>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://hhltbnrbjvxoisaizirj.supabase.co wss://hhltbnrbjvxoisaizirj.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="expect" href="#cover-slot" blocking="render">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f8f6f2">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Traccia Libri">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css" />

  <script src="vendor/motion.js" defer></script>
  <script src="ui.js" defer></script>
  <script src="pwa.js" defer></script>
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="home.html" class="nav-brand">Traccia Libri</a>
      <ul class="nav-links" id="nav-links">
        <li><a href="home.html">Home</a></li>
        <li><a href="libri.html">Tutti i libri</a></li>
        <li><a href="miei_libri.html">I miei libri</a></li>
        <li><a href="gruppi.html">Gruppi</a></li>
        <li class="nav-cta-item"><a href="aggiungi_libro.html" class="nav-cta"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Aggiungi libro</a></li>
        <li id="nav-profile-slot"></li>
      </ul>
      <button class="nav-hamburger" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="page-content">
    <a href="libri.html" class="back-link" onclick="if (history.length > 1) { history.back(); return false; }">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Indietro
    </a>
    <div id="book-details" class="book-details">
      <aside class="book-aside"><div id="cover-slot"></div></aside>
      <article class="book-main"><p class="loading-text">Caricamento…</p></article>
    </div>
    <script>
      // Anteprima immediata della copertina (per la transizione "copertina che vola")
      (function () {
        try {
          var id = new URLSearchParams(location.search).get('id');
          var b = JSON.parse(sessionStorage.getItem('tl:book') || 'null');
          if (!(b && b.id === id && b.title)) return;
          // stesso colore di clothFor() in supabaseClient.js
          var C = ['#8c3f2a', '#2f5446', '#2b3b57', '#9a6f26', '#5a3650', '#44535e', '#62622f', '#7a2e33'];
          var surname = (b.author || '').trim().split(/\s+/).pop() || '', h = 0;
          for (var ch of (b.title + surname)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
          var cover = document.createElement('div');
          cover.className = 'cover cover-lg';
          cover.style.setProperty('--cloth', C[h % C.length]);
          cover.setAttribute('aria-hidden', 'true');
          var t = document.createElement('span'); t.className = 'cover-title'; t.textContent = b.title;
          var a = document.createElement('span'); a.className = 'cover-author'; a.textContent = b.author || '';
          cover.append(t, a);
          document.getElementById('cover-slot').appendChild(cover);
        } catch (e) { /* nessuna anteprima */ }
      })();
    </script>
  </main>

  <footer>
    <p>&copy; 2025 Traccia Libri</p>
  </footer>

  <script>
    document.getElementById('nav-toggle').addEventListener('click', () => {
      const open = document.getElementById('nav-links').classList.toggle('open');
      document.getElementById('nav-toggle').setAttribute('aria-expanded', open);
    });
  </script>
  <script src="script_scheda.js" defer></script>
  <script type="speculationrules">
    {
      "prerender": [{
        "where": { "and": [
          { "href_matches": "/*" },
          { "not": { "selector_matches": "[href^='login'], [href^='index'], [href^='reset_password'], [data-no-prerender]" } }
        ]},
        "eagerness": "moderate"
      }]
    }
  </script>
</body>
</html>
