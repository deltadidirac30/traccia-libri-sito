<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script>
    // Tema: scelta salvata, altrimenti quello del sistema (prima del disegno, niente lampi)
    (function () {
      try {
        var t = localStorage.getItem('tl-theme');
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion');
        // pagina già vista in questa sessione: niente animazioni d'ingresso
        if (sessionStorage.getItem('tl:seen:' + location.pathname.split('/').pop())) document.documentElement.classList.add('tl-seen');
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <meta name="color-scheme" content="light dark">
  <title>Accedi — Traccia Libri Lettura</title>
  <link rel="preload" href="fonts/instrument-sans-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/newsreader-var.woff2" as="font" type="font/woff2" crossorigin>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://hhltbnrbjvxoisaizirj.supabase.co wss://hhltbnrbjvxoisaizirj.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f8f6f2">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Traccia Libri">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css" />
  <script src="vendor/supabase.js" defer></script>
  <script src="supabaseClient.js" defer></script>
  <script src="vendor/motion.js" defer></script>
  <script src="ui.js" defer></script>
  <script src="pwa.js" defer></script>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-card-header">
      <h1>Traccia Libri</h1>
      <p>Il diario di lettura del tuo gruppo</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tab-login">Accedi</button>
      <button class="auth-tab-btn" id="tab-register">Registrati</button>
    </div>

    <form id="login-form" class="auth-form active">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="La tua email" required />

      <label for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="La tua password" required />

      <button type="submit" class="btn-primary btn-full" id="login-btn">Accedi</button>
      <p class="auth-forgot"><a href="#" id="forgot-link">Hai dimenticato la password?</a></p>
    </form>

    <!-- Recupera password -->
    <div id="forgot-wrapper" style="display:none;">
      <form id="forgot-form" class="auth-form active">
        <p class="auth-hint">Ti mandiamo un link per scegliere una nuova password.</p>
        <label for="forgot-email">Email</label>
        <input type="email" id="forgot-email" placeholder="La tua email" required />
        <button type="submit" class="btn-primary btn-full" id="forgot-btn">Invia link</button>
        <button type="button" class="btn-secondary btn-full" id="forgot-cancel-btn">Annulla</button>
      </form>
    </div>

    <form id="register-form" class="auth-form">
      <label for="register-nickname">Nickname</label>
      <input type="text" id="register-nickname" placeholder="Scegli un nickname" required />

      <label for="register-email">Email</label>
      <input type="email" id="register-email" placeholder="La tua email" required />

      <label for="register-password">Password</label>
      <input type="password" id="register-password" placeholder="Minimo 6 caratteri" required />

      <button type="submit" class="btn-primary btn-full" id="register-btn">Crea account</button>
    </form>

    <div class="auth-footer">
      <a href="index.html">Torna alla home</a>
    </div>
  </div>

  <script src="script_login.js" defer></script>
</body>
</html>
