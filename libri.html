  <script>
    // Tema: scelta salvata, altrimenti quello del sistema (prima del disegno, niente lampi)
    (function () {
      try {
        var t = localStorage.getItem('tl-theme');
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <meta name="color-scheme" content="light dark">

<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="home.html" class="nav-brand">Traccia Libri</a>
      <ul class="nav-links" id="nav-links">
        <li><a href="home.html">Home</a></li>
        <li><a href="libri.html" class="active" aria-current="page">Tutti i libri</a></li>
        <li><a href="miei_libri.html">I miei libri</a></li>
        <li><a href="gruppi.html">Gruppi</a></li>
        <li class="nav-cta-item"><a href="aggiungi_libro.html" class="nav-cta"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Aggiungi libro</a></li>
        <li id="nav-profile-slot"></li>
      </ul>
      <button class="nav-hamburger" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="page-content">
    <div class="page-header">
      <h1>Tutti i libri</h1>
      <p>I libri condivisi nei tuoi gruppi di lettura</p>
    </div>

    <div id="books-list"></div>

    <!-- Modifica -->
    <div id="edit-section" style="display:none;" class="card edit-section">
      <div class="edit-card-header">
        <h2>Modifica scheda</h2>
        <p>Aggiorna i dettagli del libro</p>
      </div>
      <form id="edit-form">
        <input type="hidden" id="edit-addedBy" />

        <label for="edit-title">Titolo</label>
        <input type="text" id="edit-title" required />

        <label for="edit-author">Autore</label>
        <input type="text" id="edit-author" required />

        <div class="form-row">
          <div>
            <label for="edit-publicationDate">Anno di pubblicazione</label>
            <input type="number" id="edit-publicationDate" min="0" max="2100" step="1" />
          </div>
          <div>
            <label for="edit-pages">Numero di pagine</label>
            <input type="number" id="edit-pages" />
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="edit-startDate">Inizio lettura</label>
            <input type="date" id="edit-startDate" />
          </div>
          <div>
            <label for="edit-endDate">Fine lettura</label>
            <input type="date" id="edit-endDate" />
          </div>
        </div>

        <label for="edit-quote">Citazione preferita</label>
        <input type="text" id="edit-quote" />

        <label for="edit-summary">Il libro in una frase</label>
        <input type="text" id="edit-summary" />

        <label for="edit-notes">Note di lettura</label>
        <textarea id="edit-notes" rows="4"></textarea>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Salva modifiche</button>
          <button type="button" id="cancel-edit-button" class="btn-secondary">Annulla</button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Traccia Libri</p>
  </footer>

  <script>
    document.getElementById('nav-toggle').addEventListener('click', () => {
      const open = document.getElementById('nav-links').classList.toggle('open');
      document.getElementById('nav-toggle').setAttribute('aria-expanded', open);
    });
  </script>
  <script src="script_libri_all.js"></script>
</body>
</html>
